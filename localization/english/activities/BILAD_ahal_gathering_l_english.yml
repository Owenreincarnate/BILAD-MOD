l_english:
 ahal_gathering: "Ahal Gathering"
 ahal_gathering_desc: "An Ahal brings clans, merchants, travelers, poets, musicians, and warriors together beneath the open desert sky. It is a place for trade, news, songs, rivalry, courtship, and recruitment."
 ahal_gathering_host_desc: "$BULLET_WITH_TAB$May gain [prestige_i][prestige|E]\n$BULLET_WITH_TAB$May improve the host county\n$BULLET_WITH_TAB$May recruit a capable warrior or courtier"
 ahal_gathering_selection_tooltip: "Gather the camps beneath the desert sky for trade, poetry, duels, and recruitment."
 ahal_gathering_province_desc: "You will host an Ahal Gathering in [ROOT.Province.GetName]."
 ahal_arrival_and_trade: "Arrival and Trade"
 ahal_arrival_and_trade_desc: "Tents are raised, tea is poured, and merchants begin weighing livestock, cloth, salt, and other valuables."
 ahal_night_fires: "Night Fires"
 ahal_night_fires_desc: "As darkness falls, drums, songs, poems, and stories carry across the camp."
 ahal_duels_and_recruitment: "Duels and Recruitment"
 ahal_duels_and_recruitment_desc: "Young warriors test their reputation in friendly duels, while skilled guides and fighters seek a worthy patron."
 TRAVEL_NAME_FOR_ahal_gathering: "Traveling to the Ahal Gathering"
 ahal_gathering_name: "Ahal Gathering"
 ahal_gathering_owner: "Host"
 ahal_gathering_guest_desc: "Guests gather for trade, poetry, contests, and desert hospitality."
 ahal_gathering_guest_help_text: "Attend the Ahal to meet travelers, clans, merchants, and warriors."
 ahal_gathering_conclusion_desc: "The Ahal has ended, and the tents are lowered as the guests return to the desert roads."
 ahal_gathering_destination_selection: "Choose where to host the Ahal Gathering."
 ahal_gathering_predicted_cost: "The cost of the Ahal Gathering depends on your rank and chosen location."
