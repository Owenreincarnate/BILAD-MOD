l_english:
 tradition_rezzou_raids_name: "Rezzou Raids"
 tradition_rezzou_raids_desc: "This culture preserves the seasonal desert raiding practices of the Rezzou. During the wet months, mounted raiders strike rival camps, settled communities, and other nomads for captives, booty, and prestige."
 culture_parameter_unlocks_bilad_rezzou_raid_intent: "Unlocks the #V Rezzou Raid#! [raid_intent|E]"
 tradition_RICE_tuareg_name: "Kel Tagelmust"
 tradition_RICE_tuareg_desc: "This culture preserves the veiled etiquette, matrilineal clan memory, and public reputation of the Kel Tagelmust, the People of the Veil."
 culture_parameter_unlocks_bilad_ahal_gathering: "Unlocks the #V Ahal Gathering#! [activity|E]"
 BILAD_tuareg_african_counties_desc: "The [culture|E] must be present in at least five African [counties|E]"
 tradition_tribal_confederations_name: "Tribal Confederations"
 tradition_tribal_confederations_desc: "Clans and families of this culture are accustomed to joining broader tribal confederations, binding lesser groups together under shared interests, shared prestige, and negotiated authority."
 culture_parameter_unlocks_bilad_touareg_confederation: "Can offer a #V Saharan Berber Confederation#! to compatible independent tribal or nomadic rulers"
