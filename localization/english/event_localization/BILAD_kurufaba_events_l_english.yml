l_english:
 bilad_kurufaba.0001.t: "Tribute for the Mansa"
 bilad_kurufaba.0001.desc: "The wealth of my lands can be sent upward to the Mansa. A modest payment will satisfy custom, but richer tribute may buy greater favor and prestige in the Kurufaba order."
 bilad_kurufaba.0001.a: "Send a token tribute."
 bilad_kurufaba.0001.b: "Send a generous tribute."
 bilad_kurufaba.0001.c: "Send a splendid tribute."
