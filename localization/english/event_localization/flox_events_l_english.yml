l_english:
 festival_first_fonio: "Festival of the First Fonio"
 festival_first_fonio_desc: "Fonio grass is a cornerstone of our agricultural production, providing a vital stopgap against famine at the end of the rainy season, and as such its initial harvest routinely prompts festivals and celebrations. \n\nBy volunteering to both fund and attend one of these celebrations, it may present an opportunity to simultaneously interact with and impose my rule more directly upon my subjects."
 festival_first_fonio_host_desc: "$BULLET_WITH_TAB$May gain minor amounts of [prestige_i|E][prestige|E]\n$BULLET_WITH_TAB$May gain minor amounts of [legitimacy_i] [legitimacy|E]\n$BULLET_WITH_TAB$May gain minor amounts of [piety_i|E][piety|E]\n$BULLET_WITH_TAB$The county which hosts the festival may gain modifiers."
 harvest_festival: "Harvest Festival"
 harvest_festival_desc: ""
 festival_first_fonio_host_an_a: "the"
 festival_first_fonio_selection_tooltip: "Fund a minor festival to celebrate the initial fonio harvest \n\nAnticipated rewards: \n$BULLET_WITH_TAB$[prestige_i|E][prestige|E] \n$BULLET_WITH_TAB$[legitimacy_i] [legitimacy|E] \n$BULLET_WITH_TAB$[piety_i|E][piety|E] \n$BULLET_WITH_TAB$County modifiers"
 festival_first_fonio_conclusion_desc: "The festival has concluded, and we can begin our journey home."
 festival_first_fonio_province_desc: "You will fund and attend a Harvest Festival in [ROOT.Province.GetName]"
 festival_first_fonio_destination_selection: ""

 festival_first_fonio_valid_tt_time: "The Festival of the First Fonio can only be hosted in September or October"

 fest_fonio.0001.n: "The Gathering"
 fest_fonio.0001.desc: "The sun hangs low in the sky as the preparations for the festival conclude. The women of [activity.GetCurrentPhase.GetLocation.GetName] have both prepared and cooked the fonio into a collection of couscous and porridge based dishes, served alongside spices, smoked meats and remaining crops from the previous years harvest. As the first dish is placed in front of me, I can already tell this will be a night to remember."
 fest_fonio.0001.a: "Let the festival begin!"

 fest_fonio.0002.n: "The First Harvest"
 fest_fonio.0002.desc: "During periods of festivity, it is customary to leave offerings of libations or food to deceased ancestors, in the hope of recieving good fortune and protection, as well as strengthening our bond with those who preceeded us."
 fest_fonio.0002.a: "We shall honour our ancestors."
 fest_fonio.0002.b: "The people must be fed first and foremost."

 fest_fonio.0003.n: "The Harvest Dance"
 fest_fonio.0003.desc: "Following the meal, several of the locals proceed to an open area, with a large bonfire already erected in the centre. Once lit, people begin to dance around it, with others playing instruments and singing in a clearly prepared performance. As I watch, several of the dancers beckon to those of us on the outside, clearly encouraging us to participate."
 fest_fonio.0003.a: "Join the celebration."
 fest_fonio.0003.b: "Observe the festivities."
 fest_fonio.0003.c: "Lead a war dance."

 fest_fonio.0004.n: "Settling Disputes"
 fest_fonio.0004.desc: "Though communal gatherings such as these are primarily recreational affairs, they also serve as opportunities for disputes to be settled in a public manner. As a respected cultural figure, I am allowed to sit alongside the community elders and help them make decisions. A pair of notable landowners approach, and state that the changing course of a river has resulted in a significant alteration to a previously agreed upon land boundary. One wishes for us to declare that the new boundary is correct, whilst the other wishes for the prior agreement to be maintained. The elders are divided, and look to me for my judgement."
 fest_fonio.0004.a: "Encourage a compromise."
 fest_fonio.0004.b: "Side with one of the landholders."
 fest_fonio.0004.c: "Make clear you are above their petty squabbles."

 fest_fonio.0005.n: "The Conclusion"
 fest_fonio.0005.desc: "The festival has ended, and my entourage is making ready for the return home. As we depart, the locals crowd us, showering us with finely crafted gifts. The warmth of their voices, the music, the shared joy… it is not so easily set aside. Even as the fires die and the crowds thin, I find myself wishing we could linger just a while longer."
 fest_fonio.0005.a: "If only every year could be as bountiful as this."
