 bilad_blacksmith.0001.t: "The Sacred Forge"
 bilad_blacksmith.0001.desc: "The court blacksmith prepares the forge with practiced solemnity. Hammer-strokes ring through the heat, shaping iron for the warriors who ride and skirmish in my name."
 bilad_blacksmith.0001.a: "Let this iron serve a sacred purpose."
 bilad_blacksmith.0001.b: "The craft itself will bring renown."
