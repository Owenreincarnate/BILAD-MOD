l_english:
 bilad_ahal.0001.t: "The Tents Rise"
 bilad_ahal.0001.desc: "Across the open desert, tents rise one by one as families, merchants, travelers, and neighboring clans arrive for the Ahal. Tea is poured, greetings are exchanged, and rumors begin moving faster than the desert wind."
 bilad_ahal.0001.a: "Let the gathering begin."
 bilad_ahal.0010.t: "Trade Beneath the Awnings"
 bilad_ahal.0010.desc: "Livestock, salt, cloth, tools, and small luxuries change hands throughout the camp. Some urge generosity to bind the gathering together, while others see a chance to turn a profit."
 bilad_ahal.0010.a: "Spend freely and impress them."
 bilad_ahal.0010.b: "A good bargain is its own reward."
 bilad_ahal.0010.c: "Put the wealth back into the host settlement."
 bilad_ahal.0020.t: "Songs Around the Fires"
 bilad_ahal.0020.desc: "Night settles over the gathering. Around the great fires, drums answer voices, poets compete for attention, and storytellers turn the old roads of the desert into living memory."
 bilad_ahal.0020.a: "Listen carefully to the old stories."
 bilad_ahal.0020.b: "Join the songs."
 bilad_ahal.0020.c: "Trade news with every traveler."
 bilad_ahal.0030.t: "Honor in the Sand"
 bilad_ahal.0030.desc: "Young fighters step into the open ground to test themselves before the gathered clans. Most bouts are friendly, but pride, courtship, and insult can sharpen even a practice blade."
 bilad_ahal.0030.a: "Enter the contests yourself."
 bilad_ahal.0030.b: "Recruit a promising warrior."
 bilad_ahal.0030.c: "Observe from a dignified distance."
 bilad_ahal.0040.t: "The Fires Burn Low"
 bilad_ahal.0040.desc: "The last embers fade as the Ahal comes to an end. The tents are lowered, the herds are gathered, and the departing guests carry new friendships, bargains, songs, and rivalries back across the desert."
 bilad_ahal.0040.a: "Until the next gathering."
