l_english:
 bilad_aynaako.0001.t: "Herdsmen from the Grazing Roads"
 bilad_aynaako.0001.desc: "My steward's messengers return from the Fulbe grazing routes with several respected herdsmen. Each knows the movement of cattle, the temper of clan elders, and the quiet negotiations that keep herds alive through dry seasons."
 bilad_aynaako.0001.a: "The first candidate has the right discipline."
 bilad_aynaako.0001.b: "The second understands people as well as cattle."
 bilad_aynaako.0001.c: "The third has courage enough for hard country."
 bilad_aynaako.0001.d: "None are suitable."
